fraud_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: "{{ env_var('CLICKHOUSE_SCHEMA', 'analytics') }}"
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '18124') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'dbt') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'dbt_local') }}"
      secure: false
      threads: 4
      connect_timeout: 10
      send_receive_timeout: 300
